
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202020">
    <title>BAO HUY NGUYEN NGOC - ATHLETE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Thanh tiêu đề */
        .topbar {
            height: 76px;
            padding: 0 22px;
            background: #202020;
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 25px;
        }

        .back {
            font-size: 36px;
            font-weight: 300;
        }

        .top-title {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .dots {
            letter-spacing: 3px;
        }

        /* Khung nội dung */
        main {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 38px 24px 16px;
        }

        /* Poster */
        .poster-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 96px;
        }

        .poster {
            display: block;
            width: 100%;
            max-width: 580px;
            height: auto;
        }

        /* Thanh tên giải đấu và chức danh */
        .bar {
            width: 100%;
            background: #858585;
            text-align: center;
            padding: 12px 10px;
            margin-bottom: 38px;
            font-size: clamp(22px, 4vw, 38px);
            line-height: 1.2;
            font-weight: 400;
        }

        .role {
            margin-bottom: 58px;
        }

        /* Ảnh cá nhân */
        .portrait-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .portrait {
            display: block;
            width: min(100%, 390px);
            height: auto;
            object-fit: contain;
            object-position: top center;
        }

        /* Thông tin vận động viên */
        .identity {
            background: #858585;
            width: 100%;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px 10px;
            margin-bottom: 38px;
            line-height: 1.32;
        }

        .name {
            font-size: clamp(22px, 3.8vw, 32px);
            font-weight: 700;
        }

        .country {
            font-size: clamp(21px, 3.5vw, 30px);
        }

        /* Cờ Việt Nam */
        .flag-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: clamp(21px, 3.5vw, 30px);
        }

        .flag {
            width: 48px;
            height: 30px;
            flex-shrink: 0;
            background: #da001b;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .flag svg {
            width: 23px;
            height: 23px;
        }

        /* Khung xác nhận */
        .status {
            background: #858585;
            padding: 28px 10px 10px;
        }

        .check-panel {
            width: 100%;
            height: 230px;
            background: linear-gradient(
                120deg,
                #60abc5,
                #2989a4
            );
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 34px;
        }

        .check-box {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 19px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .check-box svg {
            width: 70px;
            height: 70px;
            fill: none;
            stroke: #4b9bb5;
            stroke-width: 7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Khung QR */
        .qr-frame {
            width: 100%;
            min-height: 300px;
            background: #fff;
            border: 10px solid #383838;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-image {
            display: none;
            width: 100%;
            max-width: 650px;
            height: auto;
        }

        .qr-placeholder {
            width: min(100%, 420px);
            aspect-ratio: 1 / 1;
            border: 2px dashed #aaa;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            line-height: 1.5;
        }

        footer {
            height: 38px;
            background: #171717;
            margin-top: 0;
        }

        @media (max-width: 600px) {
            .topbar {
                height: 66px;
                padding: 0 16px;
                gap: 16px;
                font-size: 20px;
            }

            main {
                padding: 26px 16px 24px;
            }

            .poster-wrap {
                margin-bottom: 58px;
            }

            .bar {
                margin-bottom: 28px;
            }

            .role {
                margin-bottom: 42px;
            }

            .portrait {
                width: min(100%, 390px);
            }

            .identity {
                min-height: 160px;
                margin-bottom: 38px;
            }

            .check-panel {
                height: 190px;
            }

            .check-box {
                width: 100px;
                height: 100px;
            }

            .check-box svg {
                width: 60px;
                height: 60px;
            }

            .qr-frame {
                min-height: 220px;
                padding: 12px;
                border-width: 8px;
            }

            .flag {
                width: 42px;
                height: 28px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <span class="back" aria-hidden="true">‹</span>
        <div class="top-title">
            WKF Online Registration - Access...
        </div>
        <span class="dots" aria-hidden="true">•••</span>
    </header>

    <main>

        <!-- Poster: poster.jpg nằm cùng thư mục index.html -->
        <div class="poster-wrap">
            <img
                class="poster"
                src="poster.jpg"
                alt="14th Karate World Championships 2026"
            >
        </div>

        <!-- Tên giải đấu -->
        <section class="bar">
            14TH KARATE WORLD CHAMPIONSHIPS
            <br>
            CADET, JUNIOR &amp; U21
        </section>

        <!-- Chức danh -->
        <section class="bar role">
            ATHLETE
        </section>

        <!-- Ảnh: bao-huy.jpg nằm cùng thư mục index.html -->
        <div class="portrait-wrap">
            <img
                class="portrait"
                src="bao-huy.jpg"
                alt="BAO HUY NGUYEN NGOC"
            >
        </div>

        <!-- Thông tin cá nhân -->
        <section class="identity">

            <div class="name">BAO HUY NGUYEN NGOC</div>

            <div class="country">VIETNAM</div>

            <div class="flag-row">
                <span class="flag" role="img" aria-label="Vietnam flag">
                    <svg viewBox="0 0 100 100" aria-hidden="true">
                        <polygon
                            points="50,5 61,37 95,37 68,57 78,90 50,70 22,90 32,57 5,37 39,37"
                            fill="#ffdf00"
                        />
                    </svg>
                </span>
                <span>VIETNAM</span>
            </div>

        </section>

        <!-- Ô xác nhận -->
        <section class="status">

            <div class="check-panel">
                <div class="check-box">
                    <svg viewBox="0 0 64 64" aria-label="Confirmed">
                        <path d="M12 33 L26 46 L53 17"></path>
                    </svg>
                </div>
            </div>

            <!-- QR: hiện ảnh khi có file qr.png -->
            <div class="qr-frame">

                <img
                    id="qrImage"
                    class="qr-image"
                    src="qr.png"
                    alt="QR code"
                >

                <div id="qrPlaceholder" class="qr-placeholder">
                    QR CODE
                    <br>
                    Tạo mã QR sau khi website được đăng tải.
                </div>

            </div>

        </section>

    </main>

    <footer></footer>

    <script>
        const qrImage = document.getElementById("qrImage");
        const qrPlaceholder = document.getElementById("qrPlaceholder");

        qrImage.onload = function () {
            qrImage.style.display = "block";
            qrPlaceholder.style.display = "none";
        };

        qrImage.onerror = function () {
            qrImage.style.display = "none";
            qrPlaceholder.style.display = "flex";
        };

        if (qrImage.complete && qrImage.naturalWidth > 0) {
            qrImage.style.display = "block";
            qrPlaceholder.style.display = "none";
        }
    </script>

</body>
</html>
